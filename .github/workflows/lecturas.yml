# Consultas semanales de las obras en Internet Archive («Las más leídas» en /cifras.html y orden del catálogo).
# Si las cifras cambiaron, publica _data/lecturas.json; esa publicación dispara la compilación en Cloudflare Pages.
name: Lecturas semanales
on:
  schedule:
    - cron: "40 7 * * 1"   # lunes, 07:40 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  lecturas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Internet Archive
        run: python3 scripts/lecturas.py
      - name: Publicar
        run: |
          git config user.name "Idearium Caribe (lecturas)"
          git config user.email "biblioteca@ideariumcaribe.com"
          git add _data/lecturas.json
          git commit -m "Lecturas semanales: $(date -u +%F)" || echo "Sin cambios"
          git push
