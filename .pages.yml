# Configuración del editor Pages CMS (app.pagescms.org) para el sitio de Idearium Caribe.
# Define qué se puede editar desde el navegador y con qué campos.

media:
  - name: pdf
    label: PDF de artículos
    input: colombeia/articulos
    output: /colombeia/articulos
    extensions: [pdf]
  - name: portadas
    label: Portadas de Colombeia
    input: colombeia/portadas
    output: /colombeia/portadas
    categories: [image]

content:
  - name: articulos
    label: Artículos de Colombeia
    type: collection
    path: colombeia/fichas
    format: yaml-frontmatter
    exclude: [fichas.11tydata.js]
    filename: "colombeia-{numero}-{titulo}.md"
    fields:
      - name: titulo
        label: Título
        type: string
        required: true
      - name: subtitulo
        label: Subtítulo
        type: string
      - name: autores
        label: Autores
        type: string
        list: true
        description: Un nombre por línea, en el orden en que figuran en la revista.
      - name: editor
        label: Edición y notas
        type: string
        description: Solo para textos inéditos o curados (por ejemplo, «Alejandro Perdomo Fermin»).
      - name: numero
        label: Número de la revista
        type: number
        required: true
      - name: orden
        label: Posición en el índice
        type: number
        description: 0 para la presentación, 1 para el primer texto, y así sucesivamente.
      - name: seccion
        label: Sección
        type: select
        options:
          values: [Presentación, Inéditos, Curados, Artículos, Ensayos]
      - name: pagina_inicial
        label: Página inicial
        type: string
      - name: pagina_final
        label: Página final
        type: string
      - name: resumen
        label: Resumen
        type: text
        description: Entre 100 y 150 palabras, aprobado por el autor.
      - name: palabras_clave
        label: Palabras clave
        type: string
        list: true
      - name: pdf
        label: PDF del artículo
        type: file
        options:
          media: pdf
          extensions: [pdf]
        description: Menos de 5 MB y con texto seleccionable (no escaneado).
      - name: doi
        label: DOI
        type: string
        description: Opcional. Solo el identificador, por ejemplo 10.5281/zenodo.1234567.
      - name: licencia
        label: Licencia
        type: string
        description: «CC BY 4.0» para textos propios de la revista; vacío para textos de terceros.

  - name: numeros
    label: Números de Colombeia
    type: collection
    path: colombeia/numeros
    format: yaml-frontmatter
    exclude: [numeros.11tydata.js]
    filename: "numero-{numero}.md"
    fields:
      - name: numero
        label: Número
        type: number
        required: true
      - name: titulo
        label: Título del número
        type: string
        required: true
      - name: fecha
        label: Fecha
        type: string
        description: Por ejemplo, «mayo-junio de 2026».
      - name: anio
        label: Año
        type: number
      - name: portada
        label: Portada
        type: image
        options:
          media: portadas
      - name: enlace_completo
        label: Enlace al número completo
        type: string
        description: Opcional (por ejemplo, la página del número en Internet Archive).

  - name: paginas
    label: Páginas
    type: collection
    path: paginas
    format: yaml-frontmatter
    exclude: [paginas.11tydata.js]
    fields:
      - name: title
        label: Título de la pestaña del navegador
        type: string
      - name: descripcion
        label: Descripción para Google
        type: text
        description: Una o dos frases (máximo unos 160 caracteres) que Google muestra bajo el título.
      - name: body
        label: Contenido (HTML)
        type: code
        options:
          format: html
        description: Cada texto aparece dos veces, en español (class="es") y en inglés (class="en"). Cambie solo el texto entre las etiquetas.

  - name: boletin
    label: "Inicio: artículos del boletín"
    type: file
    path: _data/boletin.json
    format: json
    list: true
    fields:
      - name: titulo
        label: Título
        type: string
      - name: ruta
        label: Dirección en Substack
        type: string
        description: La parte que sigue al dominio, por ejemplo /p/vallenilla-lanz-en-roma
      - name: categoria
        label: Categoría (español)
        type: string
      - name: categoria_en
        label: Categoría (inglés)
        type: string

  - name: destacados
    label: "Biblioteca: obras destacadas"
    type: file
    path: _data/destacados.json
    format: json
    list: true
    fields:
      - name: signatura
        label: Signatura
        type: string
      - name: obra
        label: Título de la obra
        type: string
      - name: detalle
        label: Detalle tras el título
        type: string
        description: Por ejemplo, «, vols. I–IV, VI–X»
      - name: enlace
        label: Enlace
        type: string
        description: La página de la obra en el catálogo, por ejemplo /biblioteca/obras/identificador-en-archive/
      - name: autor
        label: Autor
        type: string
      - name: anio
        label: Año
        type: string

  - name: catalogo
    label: "Biblioteca: catálogo"
    type: file
    path: _data/catalogo.json
    format: json
    list: true
    fields:
      - name: signatura
        label: Signatura
        type: string
        description: Por ejemplo, IC-0240
      - name: identificador
        label: Identificador en Internet Archive
        type: string
        description: La parte final de la dirección de la obra en archive.org (archive.org/details/ESTO).
      - name: titulo
        label: Título
        type: string
      - name: autor
        label: Autor
        type: string
        description: Varios autores, separados por punto y coma.
      - name: anio
        label: Año de esta edición
        type: string
      - name: primera_edicion
        label: Año de la primera edición
        type: string
      - name: pie_de_imprenta
        label: Pie de imprenta
        type: string
        description: Lugar y editorial, por ejemplo «Caracas, Tipografía Garrido».
      - name: autorizacion
        label: Autorización de derechos
        type: string
        description: Opcional. Quién autorizó la publicación, por ejemplo «Instituto Panamericano de Geografía e Historia (IPGH)». Se muestra en la página de la obra.

  - name: autores
    label: "Biblioteca: orden de autores"
    type: file
    path: _data/ordenAutores.json
    format: json
    list: true
    fields:
      - name: nombre
        label: Nombre tal como aparece en el catálogo
        type: string
      - name: forma_catalogo
        label: Forma para ordenar (Apellidos, Nombre)
        type: string
        description: Por ejemplo, «Vallenilla Lanz, Laureano». Si un autor no figura aquí, se ordena por su nombre de pila.

  - name: sitio
    label: Datos generales del sitio
    type: file
    path: _data/sitio.json
    format: json
    fields:
      - name: nombre
        label: Nombre de la entidad
        type: string
      - name: url
        label: Dirección pública del sitio
        type: string
        description: Sin barra final, por ejemplo https://www.ideariumcaribe.com
      - name: descripcion
        label: Descripción general para Google
        type: text
      - name: email
        label: Correo general (pie de página)
        type: string
      - name: email_editorial
        label: Correo de Colombeia
        type: string
      - name: email_biblioteca
        label: Correo de la Biblioteca y la Hemeroteca
        type: string
      - name: email_comunicaciones
        label: Correo de comunicaciones (prensa, alianzas, boletín)
        type: string
      - name: x_colombeia
        label: Cuenta de X de Colombeia (enlace completo)
        type: string
      - name: lccn_colombeia
        label: Número LCCN de Colombeia (Biblioteca del Congreso)
        type: string
      - name: direccion
        label: Dirección postal
        type: string
      - name: issn
        label: ISSN de Colombeia
        type: string
      - name: boletin
        label: Dirección del boletín en Substack
        type: string
        description: Sin barra final, por ejemplo https://ideariumcaribe.substack.com
      - name: biblioteca_digital
        label: Enlace a la Biblioteca Digital
        type: string
      - name: obras_biblioteca
        label: Número de obras en la Biblioteca Digital
        type: number
      - name: redes_sociales
        label: Redes sociales
        type: object
        list: true
        fields:
          - name: nombre
            type: string
          - name: enlace
            type: string
      - name: redes_academicas
        label: Redes académicas
        type: object
        list: true
        fields:
          - name: nombre
            type: string
          - name: enlace
            type: string
