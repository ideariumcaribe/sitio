<!doctype html><html lang="es"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/fuentes.css">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden;background:#fff}
body{font-family:"EB Garamond",Georgia,serif;color:#000}
#t{width:1200px;height:630px;display:grid;grid-template-columns:1fr 440px;position:relative}
.izq{padding:56px 40px 0 64px;display:flex;flex-direction:column;gap:22px;height:630px}
.marca{display:flex;align-items:center;gap:12px;font-size:24px;font-weight:500}
.marca svg{width:40px;height:40px}
.marca .sec{color:#3F3F3F;font-weight:400}
.etq{font-size:16px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:#3F3F3F}
.etq.sig{font-family:"IBM Plex Mono",monospace;letter-spacing:.04em;color:#7A5A1E;font-size:19px;text-transform:none;font-weight:400}
#titulo{font-weight:400;line-height:1.08;font-size:60px;max-height:270px;overflow:hidden;text-wrap:balance}
#autor{font-size:30px;line-height:1.2}
#detalle{font-size:22px;color:#3F3F3F;line-height:1.3}
.pie{margin-top:auto;padding-bottom:44px;font-size:19px;color:#3F3F3F;display:flex;gap:14px}
.pie b{color:#000;font-weight:500}
.der{background:#F5F5F5;position:relative;overflow:hidden}
.der img{position:absolute;object-fit:cover;border:1px solid #E3E3E0;box-shadow:0 10px 28px rgba(0,0,0,.18);background:#eee}
.uno img{width:300px;aspect-ratio:3/4.4;left:70px;top:65px}
.uno.revista img{width:290px;aspect-ratio:619/963;top:88px;left:75px}
.tres img{width:210px;aspect-ratio:3/4.3}
.mosaico{display:grid;grid-template-columns:repeat(3,108px);gap:14px;align-content:center;justify-content:center}
.mosaico img{position:static;width:108px;aspect-ratio:3/4.2}
.revistas img{width:200px;aspect-ratio:619/963}
</style></head><body>
<div id="t"><div class="izq">
  <div class="marca"><span id="sello"></span><span id="marca"></span></div>
  <div style="display:grid;gap:14px"><p class="etq" id="etq"></p><h1 id="titulo"></h1></div>
  <p id="autor"></p><p id="detalle"></p>
  <p class="pie"><b>ideariumcaribe.com</b><span id="pie"></span></p>
</div><div class="der" id="der"></div></div>
<script>
let SELLO = "", SELLO_COL = "";
window.listo = Promise.all([fetch('/assets/logo.svg').then(r => r.text()).then(s => SELLO = s), fetch('/assets/img/colombeia-logo.svg').then(r => r.text()).then(s => SELLO_COL = s), document.fonts.ready]);
window.pintar = async function (d) {
  await window.listo;
  const $ = (i) => document.getElementById(i);
  const col = d.marca === "Colombeia";
  $('sello').innerHTML = col ? SELLO_COL : SELLO;
  $('marca').innerHTML = col ? '<i>Colombeia</i>' : (d.marca === "Idearium Caribe" ? 'Idearium Caribe' : 'Idearium Caribe <span class="sec">· ' + d.marca + '</span>');
  $('etq').textContent = d.etiqueta || ""; $('etq').className = 'etq' + (d.tipo === 'obra' ? ' sig' : ''); $('etq').hidden = !d.etiqueta;
  const t = $('titulo'); t.textContent = d.titulo; t.style.fontSize = (d.tipo === 'pagina' ? 66 : 60) + 'px';
  for (let s = parseInt(t.style.fontSize); s > 30 && t.scrollHeight > 272; s -= 2) t.style.fontSize = s + 'px';
  $('autor').textContent = d.autor || ""; $('autor').hidden = !d.autor;
  $('detalle').textContent = d.detalle || ""; $('detalle').hidden = !d.detalle;
  $('pie').textContent = d.pie && d.pie !== 'ideariumcaribe.com' ? d.pie : "";
  const der = $('der'); const p = d.portadas || [];
  if (d.tipo === 'pagina' && col) {
    der.className = 'der revistas';
    der.innerHTML = p.map((u, i) => `<img src="${u}" style="width:170px;left:${14 + i * 62}px;top:${130 + (i % 2) * 14}px;transform:rotate(${-6 + i * 4}deg);z-index:${i}">`).join('');
  } else if (d.tipo === 'pagina') { der.className = 'der mosaico'; der.innerHTML = p.map((u) => `<img src="${u}">`).join(''); }
  else if (p.length > 1) {
    der.className = 'der tres';
    const pos = p.length === 2 ? [[60, 120, -5], [170, 150, 5]] : [[30, 140, -7], [115, 110, 0], [200, 140, 7]];
    der.innerHTML = p.map((u, i) => `<img src="${u}" style="left:${pos[i][0]}px;top:${pos[i][1]}px;transform:rotate(${pos[i][2]}deg);z-index:${i === 1 ? 3 : 1}">`).join('');
  } else { der.className = 'der uno' + (d.tipo === 'articulo' ? ' revista' : ''); der.innerHTML = p.map((u) => `<img src="${u}">`).join(''); }
  await Promise.all([...der.querySelectorAll('img')].map((i) => i.complete ? 0 : new Promise((r) => { i.onload = i.onerror = r; })));
};
</script></body></html>
